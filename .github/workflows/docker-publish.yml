name: Docker Build & Push to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push Image on Local Infrastructure V2
    runs-on: self-hosted  # 🚀 O Runner Global da Organização vai assumir aqui!

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 🎯 Nome sem o sufixo "-protheus-": a imagem nao tem dependencia exclusiva do Protheus
          # (ex.: tambem pode ser usada com o TOTVS Smartview). Antigo: postgres-protheus-dev.
          tags: rodrigomicrosiga/postgres-dev:16
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}